# Explicit, distinct project name: deploy/docker-compose.prod.yml also sets a name
# ("volunteer-scheduler") and this file's default (the folder name) would otherwise
# match it exactly -- running the prod compose file locally would silently replace
# these dev containers (hit this once; no data was lost, but don't repeat it).
name: volunteer-scheduler-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer
      POSTGRES_DB: volunteer_scheduler
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volunteer -d volunteer_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "uv sync --frozen --no-dev && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://volunteer:volunteer@db:5432/volunteer_scheduler
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  db_data:
    name: volunteer-scheduler_db_data
  backend_venv:
    name: volunteer-scheduler_backend_venv
  frontend_node_modules:
    name: volunteer-scheduler_frontend_node_modules
